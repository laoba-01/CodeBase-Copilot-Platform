services:
  app:
    build: .
    dns:
      - 8.8.8.8
      - 1.1.1.1
    ports:
      - "8080:8080"
    env_file: .env
    environment:
      DATABASE_URL: postgres://copilot:copilot@db:5432/copilot?sslmode=disable
      REDIS_URL: redis://redis:6379
      EMBEDDING_ADDR: embedding:50051
      # HTTP_PROXY: http://host.docker.internal:7897
      # HTTPS_PROXY: http://host.docker.internal:7897
      # http_proxy: http://host.docker.internal:7897
      # https_proxy: http://host.docker.internal:7897
      # NO_PROXY: localhost,127.0.0.1,db,redis,embedding,.local
      # no_proxy: localhost,127.0.0.1,db,redis,embedding,.local
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    volumes:
      - ./data/repos:/data/repos
      - ./web/dist:/app/web/dist

  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: copilot
      POSTGRES_PASSWORD: copilot
      POSTGRES_DB: copilot
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U copilot"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  embedding:
    build:
      context: .
      dockerfile: python-embedding/Dockerfile.cpu
    ports:
      - "50051:50051"
    environment:
      MODELSCOPE_CACHE: /modelscope-cache
    volumes:
      - modelscope_data:/modelscope-cache

volumes:
  pgdata:
  modelscope_data:
